name: runtime

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, also used as the Docker Hub tag (YYYY-MM-DD, optionally -N for repeat releases)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Validate release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ inputs.tag }}
          OBELISK_PR_TOKEN: ${{ secrets.RUNTIME_TO_OBELISK_PR }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run releases from main' >&2; exit 1; }
          [[ -n "$OBELISK_PR_TOKEN" ]] || { echo 'Secret RUNTIME_TO_OBELISK_PR is not set' >&2; exit 1; }
          [[ "$TAG" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$ ]] || { echo "Tag $TAG must look like YYYY-MM-DD or YYYY-MM-DD-N" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists" >&2
            exit 1
          else
            status=$?
            [[ "$status" -eq 2 ]] || exit "$status"
          fi

      - name: Build runtime
        run: nix build --print-build-logs

      - name: Enable KVM access
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -w /dev/kvm

      - name: Boot and run guest command
        run: nix develop -c python3 scripts/smoke-test.py result

      - name: Stage runtime
        run: nix develop -c bash scripts/stage-release.sh result flake.lock builds

      - name: Verify staged runtime
        run: |
          nix develop -c bash scripts/install-release.sh builds "$RUNNER_TEMP/activity-vm-firecracker-installed"
          nix develop -c python3 scripts/smoke-test.py "$RUNNER_TEMP/activity-vm-firecracker-installed"

      - uses: actions/upload-artifact@v7
        with:
          name: activity-vm-firecracker-runtime-${{ github.sha }}
          path: builds/
          if-no-files-found: error
          retention-days: 7

      - uses: oras-project/setup-oras@v1
        if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Push runtime to Docker Hub
        id: push
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "$DOCKER_HUB_TOKEN" | oras login docker.io -u "$DOCKER_HUB_USERNAME" --password-stdin
          image=docker.io/getobelisk/activity-vm-firecracker-runtime
          cd builds
          printf '%s\n' '{"architecture":"amd64","os":"linux"}' > oci-config.json
          oras push "${image}:${TAG}" \
            --config oci-config.json:application/vnd.oci.image.config.v1+json \
            --annotation "dev.obelisk.artifact.kind=activity-vm-firecracker.v1" \
            "activity-vm-firecracker.tar.zst:application/vnd.obelisk.activity-vm-firecracker.v1+zstd" \
            firecracker-source.txt:text/plain \
            firecracker-version.txt:text/plain \
            SHA256SUMS:text/plain
          descriptor=$(oras manifest fetch --descriptor "${image}:${TAG}")
          echo "$descriptor"
          manifest_digest=$(printf '%s' "$descriptor" | jq -er .digest)
          echo "reference=oci://${image}:${TAG}@${manifest_digest}" >> "$GITHUB_OUTPUT"

      - name: Open obelisk version-bump PR
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_TO_OBELISK_PR }}
          REFERENCE: ${{ steps.push.outputs.reference }}
          TAG: ${{ inputs.tag }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/obeli-sk/obelisk.git" obelisk-clone
          cd obelisk-clone
          version_file=crates/embedded-assets/activity-vm-firecracker-runtime-version.txt
          if [[ ! -f "$version_file" ]]; then
            echo "::warning::obelisk main has no $version_file yet; pin $REFERENCE by hand"
            exit 0
          fi
          branch="bump/activity-vm-firecracker-runtime-${TAG}"
          git switch -c "$branch"
          printf '%s' "$REFERENCE" > "$version_file"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$version_file"
          git commit -m "chore: bump activity-vm-firecracker runtime to ${TAG}"
          git push origin "$branch"
          # shellcheck disable=SC2016
          body=$(printf 'Automated bump of the Firecracker activity VM runtime to `%s`.\n\n`%s`\n' "$TAG" "$REFERENCE")
          gh pr create --repo obeli-sk/obelisk --base main --head "$branch" \
            --title "chore: bump activity-vm-firecracker runtime to ${TAG}" \
            --body "$body"

      - name: Create release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
